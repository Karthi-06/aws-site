<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Deployment Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .status {
            text-align: center;
            font-size: 18px;
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .status.error {
            background: #ffebee;
            color: #c62828;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }
        
        .info-card {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        
        .info-card label {
            font-weight: bold;
            color: #667eea;
            display: block;
            margin-bottom: 5px;
        }
        
        .info-card p {
            color: #666;
            word-break: break-all;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            width: 100%;
            margin-top: 20px;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 AWS Deployment Test</h1>
        <div class="status" id="status">Checking deployment status...</div>
        
        <div class="info-grid">
            <div class="info-card">
                <label>Deployment Status</label>
                <p id="deploymentStatus">Checking...</p>
            </div>
            <div class="info-card">
                <label>Server Time</label>
                <p id="serverTime">Loading...</p>
            </div>
            <div class="info-card">
                <label>Hostname</label>
                <p id="hostname">Loading...</p>
            </div>
            <div class="info-card">
                <label>Environment</label>
                <p id="environment">AWS</p>
            </div>
        </div>
        
        <button onclick="testConnection()">Test Connection</button>
        <div class="footer">
            <p>✓ Successfully deployed on AWS</p>
            <p id="timestamp"></p>
        </div>
    </div>
    
    <script>
        function updateStatus() {
            const statusEl = document.getElementById('status');
            const deploymentStatusEl = document.getElementById('deploymentStatus');
            const serverTimeEl = document.getElementById('serverTime');
            const hostnameEl = document.getElementById('hostname');
            const timestampEl = document.getElementById('timestamp');
            
            const now = new Date();
            serverTimeEl.textContent = now.toLocaleString();
            hostnameEl.textContent = window.location.hostname || 'localhost';
            timestampEl.textContent = `Last updated: ${now.toISOString()}`;
            
            statusEl.textContent = '✓ Deployment successful!';
            statusEl.classList.remove('error');
            deploymentStatusEl.textContent = 'Active';
        }
        
        function testConnection() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Testing connection...';
            
            setTimeout(() => {
                statusEl.textContent = '✓ Connection test passed!';
                statusEl.classList.remove('error');
                updateStatus();
            }, 1000);
        }
        
        window.addEventListener('load', updateStatus);
        setInterval(updateStatus, 5000);
    </script>
</body>
</html>
